      .box03bg {

      }

      .box03bg::before {
         content: '';
         position: absolute;
         top: 0;
         left: 0;
         width: 100%;
         height: 100%;
         background-color: rgba(255, 255, 255, 0.6);
         z-index: -1;

      /* s03 btn-group */
      .btn-group {

         flex-wrap: wrap;

         justify-content: center;
         gap: 10px;
      }

      .s03-outline {

         color: var(--myjumpcolor01);
         display: flex;
         align-items: center;
         justify-content: center;
         padding: 5px 15px;
         box-shadow: 3px 3px 10px rgba(0, 0, 0, 0.2);
         transition: all 0.3s ease-in-out;
         justify-content: center;
         align-items: center;
         border-radius: 15px;
      }

      .btn-check:checked+.s03-outline {

         color: white;
         box-shadow: 10px 10px 20px rgba(0, 0, 0, 0.3);
         /* 滑鼠懸停 & 被選中時陰影加強 */
         transform: translateY(-2px);
      }

      /* s04 */
      #item-card {
         display: flex;
         /* 使用 flexbox */
         flex-wrap: wrap;
         /* 允許換行 */
      }

      .card {
         display: flex;
         /* 使每個卡片成為 flex 容器 */
         flex-direction: column;
         /* 垂直排列內容 */
         height: 100%;
         /* 確保卡片高度一致 */
      }

      .card-title-color {
         --lte-card-variant-bg: var(--myjumpcolor01);
         --lte-card-variant-bg-rgb: 220, 53, 69;
         --lte-card-variant-color: #fff;
         --lte-card-variant-color-rgb: 255, 255, 255;
      }

      .card-header {
         display: flex;
         /* 使用 flexbox 進行佈局 */
         justify-content: space-between;
         /* 兩端對齊 */
         align-items: center;
         /* 垂直置中 */
      }

      .card-title {
         flex: 1;
         /* 允許標題佔用剩餘空間 */
         white-space: nowrap;
         /* 不換行 */
         overflow: hidden;
         /* 隱藏超出部分 */
         text-overflow: ellipsis;
         /* 使用省略號表示多餘文字 */
         margin: 0;
         /* 移除默認邊距 */
      }

      .card-tools {
         margin-left: 10px;
         /* 按鈕與標題之間的間距 */
      }

      .card-body {
         display: flex;
         flex: 1;
         /* 使卡片內容區域佔滿剩餘空間 */
         overflow: hidden;
         background-position: center;
         background-size: cover;
         background-repeat: no-repeat;
         flex-direction: column;
         /* 預設為直向排列 */
         align-items: center;
         justify-content: space-between;
         /* 在可用空間中分配內容 */
      }

      .card-body-left {
         display: flex;
         /* 使用 Flexbox */
         flex-direction: column;
         /* 垂直排列內容 */
         justify-content: center;
         /* 垂直居中 */
         align-items: center;
         /* 水平置中 */
         height: 100%;
         /* 使內容區域填滿 */
      }

      .card-body-img {
         height: auto;
         max-width: 100%;
         /* 確保圖片不超出容器 */
         max-height: 190px;
         /* 設定最大高度以保持一致性 */
         display: block;
         /* 移除圖片下方的多餘間距 */
      }

      .card.maximized-card .card-body {
         display: flex;
         flex-direction: row;
         /* 變成橫向排列 */
         justify-content: space-between;
         align-items: center;
         height: 100%;
         padding: 20px;
         /* 增加內距，讓版面更美觀 */
      }

      .card.maximized-card .card-body-left {
         width: 50%;
         /* 讓圖片佔左半部 */
         height: auto;
         /* 保持原比例 */
      }

      .card-body-text {
         display: none;
      }

      .card.maximized-card .card-body-text {
         display: block;
         /* 最大化時顯示 */
         width: 50%;
         /* 右側文字區佔 50% */
         padding: 20px;

<script>
function addToCart(img, brand, name, type, price) {
  const cart = JSON.parse(localStorage.getItem("cart")) || [];
  cart.push({
    img: img,
    brand: brand,
    name: name,
    type: type,
    price: parseInt(price)
  });
  localStorage.setItem("cart", JSON.stringify(cart));
  alert("商品已加入購物車");
}
</script>

            maximizeIcon.show(); // 顯示放大圖示

         }
      });


      function setCookie(cname, cvalue, exdays) {
         const d = new Date();
         d.setTime(d.getTime() + (exdays * 24 * 60 * 60 * 1000));
         let expires = "expires=" + d.toUTCString();
         document.cookie = cname + "=" + cvalue + ";" + expires + ";path=/";
         console.log(document.cookie);
      }

      function getCookie(cname) {
         let name = cname + "=";
         let ca = document.cookie.split(';');
         for (let i = 0; i < ca.length; i++) {
            let c = ca[i];
            while (c.charAt(0) == ' ') {
               c = c.substring(1);
            }
            if (c.indexOf(name) == 0) {
               return c.substring(name.length, c.length);
            }
         }
         return "";
      }
